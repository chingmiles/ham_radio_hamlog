{% extends 'base.html' %}
{% block title %}{{ tr('account') }} - HamLog{% endblock %}
{% block content %}
<div class="toolbar">
  <div><h1 style="margin:0 0 6px;">{{ tr('account') }}</h1><div class="muted">Callsign-style username and password settings.</div></div>
</div>
<div class="grid grid-2">
  <div class="card">
    <h2>{{ tr('change_username') }}</h2>
    <form method="post">
      <input type="hidden" name="action" value="username">
      <div style="margin-bottom:14px;"><label>{{ tr('current_username') }}</label><input type="text" value="{{ current_user.username }}" disabled></div>
      <div style="margin-bottom:18px;"><label>{{ tr('new_username') }}</label><input type="text" name="new_username" value="{{ current_user.username }}" required></div>
      <div class="btn-row"><button class="btn btn-primary" type="submit">{{ tr('update_username') }}</button></div>
    </form>
  </div>
  <div class="card">
    <h2>{{ tr('change_password') }}</h2>
    <form method="post">
      <input type="hidden" name="action" value="password">
      <div style="margin-bottom:14px;"><label>{{ tr('current_password') }}</label><input type="password" name="current_password" required></div>
      <div style="margin-bottom:14px;"><label>{{ tr('new_password') }}</label><input type="password" name="new_password" required></div>
      <div style="margin-bottom:18px;"><label>{{ tr('confirm_password') }}</label><input type="password" name="confirm_password" required></div>
      <div class="btn-row"><button class="btn btn-primary" type="submit">{{ tr('update_password') }}</button><a class="btn" href="{{ url_for('dashboard') }}">{{ tr('return_dashboard') }}</a></div>
    </form>
  </div>
</div>
{% endblock %}
